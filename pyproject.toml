[project]
name = "gmao-incidencias"
version = "0.1.0"
description = "Sistema de gestión de incidencias para administración de fincas"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "sqlalchemy>=2.0.37",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"
